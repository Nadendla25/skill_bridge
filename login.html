<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - SkillBridge</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="css/auth.css">

</head>

<body>

    <div class="auth-page">

        <div class="auth-card">

            <h1>
                SkillBridge
            </h1>

            <h2>
                Welcome Back
            </h2>

            <p>
                Continue your learning journey 🚀
            </p>


            <form id="loginForm">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <button type="button" onclick="loginUser()">
                    Login
                </button>

            </form>


            <p id="message"></p>


            <p class="auth-link">

                Don't have an account?

                <a href="register.html">
                    Register
                </a>

            </p>

        </div>

    </div>


    <script src="js/auth.js"></script>

</body>

</html>
